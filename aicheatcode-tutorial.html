<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AICHeatCode — Install &amp; Usage Guide</title>
<style>
  :root{
    --bg:#ffffff;
    --bg-soft:#f5f4ff;
    --card:#ffffff;
    --text:#1a1a2e;
    --muted:#5b5b72;
    --accent:#6d5efc;
    --accent-soft:#ece9ff;
    --border:#e6e4f2;
    --ok:#1f9d6b;
    --radius:16px;
    --shadow:0 6px 24px rgba(60,40,160,.08);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0f0f17;
      --bg-soft:#171726;
      --card:#171726;
      --text:#ecebff;
      --muted:#a3a2c4;
      --accent:#8b7dff;
      --accent-soft:#23223d;
      --border:#2a2942;
      --shadow:0 6px 24px rgba(0,0,0,.4);
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue","PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg);
    color:var(--text);
    line-height:1.65;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:880px;margin:0 auto;padding:0 20px}
  header{
    position:sticky;top:0;z-index:10;
    background:color-mix(in srgb, var(--bg) 86%, transparent);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--border);
  }
  .nav{display:flex;align-items:center;justify-content:space-between;height:62px}
  .brand{font-weight:800;font-size:18px;letter-spacing:.2px;display:flex;align-items:center;gap:9px}
  .brand .dot{width:12px;height:12px;border-radius:4px;background:var(--accent);display:inline-block}
  .lang{display:inline-flex;background:var(--bg-soft);border:1px solid var(--border);border-radius:999px;padding:3px}
  .lang button{
    border:0;background:transparent;color:var(--muted);
    font:inherit;font-size:13px;font-weight:600;cursor:pointer;
    padding:6px 14px;border-radius:999px;transition:.18s;
  }
  .lang button.active{background:var(--accent);color:#fff}
  .hero{padding:64px 0 40px;text-align:center}
  .hero h1{font-size:clamp(28px,5vw,44px);line-height:1.15;margin:0 0 16px;font-weight:800}
  .hero p{font-size:17px;color:var(--muted);max-width:620px;margin:0 auto 28px}
  .cta{
    display:inline-flex;align-items:center;gap:10px;
    background:var(--accent);color:#fff;text-decoration:none;
    font-weight:700;font-size:16px;padding:14px 26px;border-radius:12px;
    box-shadow:var(--shadow);transition:.2s;
  }
  .cta:hover{transform:translateY(-2px);filter:brightness(1.05)}
  .cta .arrow{font-size:18px}
  .meta{margin-top:14px;font-size:13px;color:var(--muted)}
  section{padding:44px 0;border-top:1px solid var(--border)}
  h2{font-size:24px;margin:0 0 6px;font-weight:800}
  .lead{color:var(--muted);margin:0 0 28px}
  .steps{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
  @media(max-width:640px){.steps{grid-template-columns:1fr}}
  .step{
    background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
    padding:22px;box-shadow:var(--shadow);position:relative;
  }
  .step .num{
    width:34px;height:34px;border-radius:10px;background:var(--accent-soft);color:var(--accent);
    font-weight:800;display:flex;align-items:center;justify-content:center;margin-bottom:14px;
  }
  .step h3{margin:0 0 8px;font-size:17px}
  .step p{margin:0;color:var(--muted);font-size:14.5px}
  .step code{background:var(--bg-soft);border:1px solid var(--border);border-radius:6px;padding:1px 6px;font-size:13px;color:var(--text)}
  .callout{
    background:var(--accent-soft);border:1px solid var(--accent);
    border-radius:var(--radius);padding:24px;margin-top:8px;
  }
  .callout h3{margin:0 0 10px;font-size:18px;color:var(--accent)}
  .callout ol{margin:0;padding-left:20px;color:var(--text)}
  .callout li{margin:6px 0}
  details{
    background:var(--card);border:1px solid var(--border);border-radius:12px;
    padding:0 18px;margin-bottom:12px;
  }
  summary{
    cursor:pointer;font-weight:700;padding:16px 0;list-style:none;
    display:flex;justify-content:space-between;align-items:center;gap:12px;
  }
  summary::-webkit-details-marker{display:none}
  summary::after{content:"+";color:var(--accent);font-size:20px;font-weight:700}
  details[open] summary::after{content:"\2212"}
  details p{margin:0 0 16px;color:var(--muted)}
  footer{padding:40px 0 60px;color:var(--muted);font-size:13px;text-align:center}
  footer a{color:var(--accent);text-decoration:none}
  .badge{display:inline-block;background:var(--bg-soft);border:1px solid var(--border);border-radius:999px;padding:4px 12px;font-size:12px;color:var(--muted);margin-top:10px}
</style>
</head>
<body>
<header>
  <div class="wrap nav">
    <div class="brand"><span class="dot"></span> AICHeatCode</div>
    <div class="lang" role="group" aria-label="Language">
      <button class="lang-btn" data-lang="en">EN</button>
      <button class="lang-btn" data-lang="zh">中文</button>
    </div>
  </div>
</header>

<div class="wrap">

  <!-- HERO -->
  <div class="hero">
    <h1 data-en="Batch-drive Google Flow — free &amp; local" data-zh="批量驱动 Google Flow —— 免费且本地运行"></h1>
    <p data-en="A self-hosted Chrome extension that turns your prompts into images &amp; videos on Google Flow, automatically. No login. Runs locally. Sends no data anywhere."
       data-zh="一个自托管的 Chrome 扩展，把你的提示词在 Google Flow 上自动生成图片与视频。无需登录，本地运行，不向任何第三方发送数据。"></p>
    <a class="cta" href="https://github.com/lizehaodanniel/flow-image-automator/releases/download/v1.3.23/flow-extension-v1.3.23.zip">
      <span data-en="Download v1.3.23 (Free)" data-zh="下载 v1.3.23（免费）"></span>
      <span class="arrow">↓</span>
    </a>
    <div class="meta" data-en="Chrome · Edge · Brave  ·  Windows / macOS / Linux  ·  v1.3.23"
         data-zh="Chrome · Edge · Brave  ·  Windows / macOS / Linux  ·  v1.3.23"></div>
  </div>

  <!-- STEPS -->
  <section>
    <h2 data-en="How to install &amp; use" data-zh="如何安装与使用"></h2>
    <p class="lead" data-en="About 30 seconds. No Chrome Web Store needed."
       data-zh="约 30 秒搞定，无需 Chrome 应用商店。"></p>
    <div class="steps">
      <div class="step">
        <div class="num">1</div>
        <h3 data-en="Unzip" data-zh="解压"></h3>
        <p data-en="Unzip <code>flow-extension-v1.3.23.zip</code> to a permanent folder. Do NOT move or delete it later, or the extension will break."
           data-zh="把 <code>flow-extension-v1.3.23.zip</code> 解压到一个固定文件夹。之后不要移动或删除它，否则扩展会失效。"></p>
      </div>
      <div class="step">
        <div class="num">2</div>
        <h3 data-en="Enable Developer mode" data-zh="开启开发者模式"></h3>
        <p data-en="Open <code>chrome://extensions</code> (Edge: <code>edge://extensions</code>, Brave: <code>brave://extensions</code>) and turn on <b>Developer mode</b> (top-right)."
           data-zh="打开 <code>chrome://extensions</code>（Edge 用 <code>edge://extensions</code>，Brave 用 <code>brave://extensions</code>），右上角打开<b>开发者模式</b>。"></p>
      </div>
      <div class="step">
        <div class="num">3</div>
        <h3 data-en="Load unpacked" data-zh="加载解压版"></h3>
        <p data-en="Click <b>Load unpacked</b> and select the unzipped folder (it must contain <code>manifest.json</code>)."
           data-zh="点击<b>加载已解压的扩展程序</b>，选中解压出来的文件夹（里面要有 <code>manifest.json</code>）。"></p>
      </div>
      <div class="step">
        <div class="num">4</div>
        <h3 data-en="Open Flow &amp; Run" data-zh="打开 Flow 并运行"></h3>
        <p data-en="Open &amp; sign in to <a href='https://labs.google/fx' style='color:var(--accent)'>Google Flow</a>. Click the extension icon → open the <b>side panel</b> → pick a mode → paste prompts (one per line) → hit <b>Run ▶</b>."
           data-zh="打开并登录 <a href='https://labs.google/fx' style='color:var(--accent)'>Google Flow</a>。点击扩展图标 → 打开<b>侧边栏</b> → 选模式 → 粘贴提示词（每行一条）→ 点<b>运行 ▶</b>。"></p>
      </div>
    </div>
  </section>

  <!-- CHARACTER REFERENCE -->
  <section>
    <h2 data-en="Keep one person consistent" data-zh="让人物保持一致"></h2>
    <p class="lead" data-en="Want every image to show the same person? Use Character Reference."
       data-zh="希望每张图都是同一个人？用「角色参考图」功能。"></p>
    <div class="callout">
      <h3 data-en="Character Reference (face lock)" data-zh="角色参考图（人脸锁定）"></h3>
      <ol>
        <li data-en="In the side panel, go to <b>Character reference</b> and tick <b>Enable character lock</b>."
            data-zh="在侧边栏找到<b>角色参考图</b>，勾选<b>启用角色固定</b>。"></li>
        <li data-en="Click <b>Select reference…</b> and choose a clear, front-facing photo."
            data-zh="点击<b>选择参考图…</b>，选一张清晰的正面照。"></li>
        <li data-en="Paste your prompts — describe only the scene/action/outfit, <b>not</b> the person's looks."
            data-zh="粘贴提示词 —— 只写场景/动作/服装，<b>不要</b>描述长相。"></li>
        <li data-en="Hit <b>Run ▶</b>. The extension starts a fresh project per line and re-injects your reference, so the character stays consistent (no drift)."
            data-zh="点<b>运行 ▶</b>。扩展每条都新建项目并重新注入参考图，人物保持一致、不会跑偏。"></li>
      </ol>
    </div>
  </section>

  <!-- FAQ -->
  <section>
    <h2 data-en="FAQ" data-zh="常见问题"></h2>
    <details>
      <summary data-en="Does the extension request a “debugger” permission?" data-zh="扩展会请求「debugger」权限吗？"></summary>
      <p data-en="No. Since v1.3.22 it no longer requests the debugger (Chrome DevTools Protocol) permission. It drives Flow purely with synthetic DOM events, which avoids Flow's anti-debugging that used to kick the page out. As an unpacked extension you loaded yourself, it sends no data anywhere."
         data-zh="不会。自 v1.3.22 起不再请求 debugger（Chrome 调试协议）权限。它只用合成 DOM 事件驱动 Flow，可避开会踢出页面的反调试机制。作为你自己加载的解压版扩展，它不会向任何地方发送数据。"></p>
    </details>
    <details>
      <summary data-en="Does it cost money?" data-zh="要花钱吗？"></summary>
      <p data-en="The extension is free. But Google Flow charges <b>your own</b> Flow credits for generation (tied to your Google account, independent of this tool). Image-only modes are cheaper than video."
         data-zh="扩展本身免费。但 Google Flow 生成时会扣你<b>自己</b>的 Flow 积分（绑你的 Google 账号，与本扩展无关）。只出图比出视频更省。"></p>
    </details>
    <details>
      <summary data-en="“Service Worker inactive” / “Cannot reach background”?" data-zh="提示「Service Worker 不活动」/「无法连接后台」？"></summary>
      <p data-en="Go to <code>chrome://extensions</code>, find AICHeatCode, and click the 🔄 reload button on its card."
         data-zh="打开 <code>chrome://extensions</code>，找到 AICHeatCode，点它卡片上的 🔄 重新加载按钮。"></p>
    </details>
    <details>
      <summary data-en="How do I update to a newer version?" data-zh="怎么更新到新版本？"></summary>
      <p data-en="Download the new zip, replace the contents of the old folder, then click 🔄 reload on the extension's card in <code>chrome://extensions</code>."
         data-zh="下载新 zip，替换旧文件夹里的内容，然后在 <code>chrome://extensions</code> 里点扩展卡片上的 🔄 重新加载。"></p>
    </details>
  </section>

  <footer>
    <p data-en="Not affiliated with or endorsed by Google. Google Flow's features, pricing, and page structure can change at any time."
       data-zh="与 Google 无关联、未获其认可。Google Flow 的功能、价格与页面结构可能随时变动。"></p>
    <p><a href="https://github.com/lizehaodanniel/flow-image-automator" data-en="View source on GitHub" data-zh="在 GitHub 查看源码"></a></p>
    <span class="badge">AICHeatCode v1.3.23</span>
  </footer>

</div>

<script>
  (function(){
    var root = document.documentElement;
    var buttons = document.querySelectorAll('.lang-btn');
    function apply(lang){
      document.querySelectorAll('[data-en]').forEach(function(el){
        var t = el.getAttribute('data-' + lang);
        if(t !== null) el.innerHTML = t;
      });
      root.lang = (lang === 'zh') ? 'zh-CN' : 'en';
      buttons.forEach(function(b){ b.classList.toggle('active', b.dataset.lang === lang); });
      try{ localStorage.setItem('acc-lang', lang); }catch(e){}
    }
    buttons.forEach(function(b){
      b.addEventListener('click', function(){ apply(b.dataset.lang); });
    });
    var saved = 'en';
    try{ saved = localStorage.getItem('acc-lang') || 'en'; }catch(e){}
    // also honour browser language on first visit
    if(!localStorage.getItem('acc-lang') && navigator.language && navigator.language.toLowerCase().indexOf('zh') === 0){
      saved = 'zh';
    }
    apply(saved);
  })();
</script>
</body>
</html>
