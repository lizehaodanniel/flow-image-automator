<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AICheatCode — Quick Start</title>
<style>
  :root{
    --bg:#ffffff;--bg-soft:#f5f4ff;--card:#ffffff;--text:#1a1a2e;--muted:#5b5b72;
    --accent:#6d5efc;--accent-soft:#ece9ff;--border:#e6e4f2;--radius:14px;
    --shadow:0 4px 16px rgba(60,40,160,.07);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0f0f17;--bg-soft:#171726;--card:#171726;--text:#ecebff;--muted:#a3a2c4;
      --accent:#8b7dff;--accent-soft:#23223d;--border:#2a2942;
      --shadow:0 4px 16px rgba(0,0,0,.4);
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased}
  .wrap{max-width:880px;margin:0 auto;padding:0 20px}
  header{position:sticky;top:0;z-index:10;background:color-mix(in srgb, var(--bg) 86%, transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
  .nav{display:flex;align-items:center;justify-content:space-between;height:56px}
  .brand{font-weight:800;font-size:17px;display:flex;align-items:center;gap:8px}
  .brand .dot{width:11px;height:11px;border-radius:3px;background:var(--accent);display:inline-block}
  .lang{display:inline-flex;background:var(--bg-soft);border:1px solid var(--border);border-radius:999px;padding:3px}
  .lang button{border:0;background:transparent;color:var(--muted);font:inherit;font-size:12.5px;font-weight:600;cursor:pointer;padding:5px 12px;border-radius:999px;transition:.18s}
  .lang button.active{background:var(--accent);color:#fff}
  .hero{padding:36px 0 18px;text-align:center}
  .hero h1{font-size:clamp(24px,4.4vw,34px);line-height:1.2;margin:0 0 10px;font-weight:800}
  .hero p{font-size:15px;color:var(--muted);max-width:600px;margin:0 auto 18px}
  .cta{display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:#fff;text-decoration:none;font-weight:700;font-size:15px;padding:11px 22px;border-radius:10px;box-shadow:var(--shadow);transition:.2s}
  .cta:hover{transform:translateY(-1px);filter:brightness(1.05)}
  .cta .arrow{font-size:16px}
  .meta{margin-top:10px;font-size:12px;color:var(--muted)}
  section{padding:22px 0;border-top:1px solid var(--border)}
  h2{font-size:19px;margin:0 0 4px;font-weight:800}
  .lead{color:var(--muted);margin:0 0 18px;font-size:14px}
  .steps{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
  @media(max-width:600px){.steps{grid-template-columns:1fr}}
  .step{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
  .step .num{width:28px;height:28px;border-radius:8px;background:var(--accent-soft);color:var(--accent);font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;margin-bottom:10px}
  .step h3{margin:0 0 4px;font-size:14.5px}
  .step p{margin:0;color:var(--muted);font-size:13px}
  .step code{background:var(--bg-soft);border:1px solid var(--border);border-radius:5px;padding:1px 5px;font-size:12px;color:var(--text)}
  .callout{background:var(--accent-soft);border:1px solid var(--accent);border-radius:var(--radius);padding:14px 18px;margin-top:6px;font-size:13.5px}
  .callout b{color:var(--accent)}
  footer{padding:22px 0 32px;color:var(--muted);font-size:12px;text-align:center}
  footer a{color:var(--accent);text-decoration:none;font-weight:600}
</style>
</head>
<body>
<header>
  <div class="wrap nav">
    <div class="brand"><span class="dot"></span> AICheatCode</div>
    <div class="lang">
      <button class="lang-btn" data-lang="en">EN</button>
      <button class="lang-btn" data-lang="zh">中文</button>
    </div>
  </div>
</header>
<div class="wrap">
  <div class="hero">
    <h1 data-en="Batch-drive Google Flow — free &amp; local" data-zh="批量驱动 Google Flow —— 免费且本地运行"></h1>
    <p data-en="A self-hosted Chrome extension that batch-submits prompts to Google Flow and auto-downloads images &amp; videos. No login, runs locally, sends no data anywhere."
       data-zh="一个自托管的 Chrome 扩展，把提示词批量提交到 Google Flow 并自动下载图片与视频。无需登录，本地运行，不向任何第三方发送数据。"></p>
    <a class="cta" href="https://github.com/lizehaodanniel/flow-image-automator/releases/download/v1.3.22/flow-extension-v1.3.22.zip">
      <span data-en="Download v1.3.22 (Free)" data-zh="下载 v1.3.22（免费）"></span><span class="arrow">↓</span>
    </a>
    <div class="meta" data-en="Chrome · Edge · Brave  ·  Windows / macOS / Linux" data-zh="Chrome · Edge · Brave  ·  Windows / macOS / Linux"></div>
  </div>

  <section>
    <h2 data-en="Install in 30 seconds" data-zh="30 秒安装"></h2>
    <p class="lead" data-en="Unpacked extension — no Web Store fee." data-zh="解压版扩展，无需应用商店。"></p>
    <div class="steps">
      <div class="step"><div class="num">1</div>
        <h3 data-en="Unzip" data-zh="解压"></h3>
        <p data-en="Unzip to a permanent folder. Don't move or delete it later." data-zh="解压到一个固定文件夹，之后别动它。"></p>
      </div>
      <div class="step"><div class="num">2</div>
        <h3 data-en="Developer mode" data-zh="开开发者模式"></h3>
        <p data-en="Open <code>chrome://extensions</code>, turn on <b>Developer mode</b> (top-right)." data-zh="打开 <code>chrome://extensions</code>，右上角打开<b>开发者模式</b>。"></p>
      </div>
      <div class="step"><div class="num">3</div>
        <h3 data-en="Load unpacked" data-zh="加载解压版"></h3>
        <p data-en="Click <b>Load unpacked</b>, pick the unzipped folder (must contain <code>manifest.json</code>)." data-zh="点<b>加载已解压的扩展程序</b>，选中解压的文件夹（里面要有 <code>manifest.json</code>）。"></p>
      </div>
      <div class="step"><div class="num">4</div>
        <h3 data-en="Open Flow &amp; Run ▶" data-zh="打开 Flow 并运行 ▶"></h3>
        <p data-en="Sign in to <a href='https://labs.google/fx' style='color:var(--accent)'>Flow</a> → extension icon → side panel → paste prompts (one per line) → Run." data-zh="登录 <a href='https://labs.google/fx' style='color:var(--accent)'>Flow</a> → 点扩展图标 → 打开<b>侧边栏</b> → 粘贴提示词（每行一条）→ 运行。"></p>
      </div>
    </div>
  </section>

  <section>
    <div class="callout" data-en="<b>Keep one person consistent?</b> In the side panel, enable <b>Character reference</b>, pick a clear front-facing photo, then describe only the scene — every image uses that reference as the base, so the character stays the same across the batch."
       data-zh="<b>想让人物保持一致？</b>侧边栏里启用<b>角色参考图</b>，选一张清晰的正面照，提示词只写场景不写长相——每张图都以那张图为基准，人物自然一致。"></div>
  </section>

  <footer>
    <p data-en="Need more (FAQ, debugging, character reference details)? See the " data-zh="需要 FAQ、调试、角色参考图细节？看 "><a href="https://lizehaodanniel.github.io/flow-image-automator/aicheatcode-tutorial.html" data-en="full tutorial →" data-zh="完整教程 →"></a></p>
    <p data-en="Not affiliated with or endorsed by Google." data-zh="与 Google 无关联、未获其认可。"></p>
  </footer>
</div>
<script>
(function(){
  var root=document.documentElement, btns=document.querySelectorAll('.lang-btn');
  function apply(l){
    document.querySelectorAll('[data-en]').forEach(function(el){ var t=el.getAttribute('data-'+l); if(t!==null) el.innerHTML=t; });
    root.lang = (l==='zh')?'zh-CN':'en';
    btns.forEach(function(b){ b.classList.toggle('active', b.dataset.lang===l); });
    try{ localStorage.setItem('acc-lang',l); }catch(e){}
  }
  btns.forEach(function(b){ b.addEventListener('click', function(){ apply(b.dataset.lang); }); });
  var s='en';
  try{ var stored=localStorage.getItem('acc-lang'); s=stored||((navigator.language||'').toLowerCase().indexOf('zh')===0?'zh':'en'); }catch(e){}
  apply(s);
})();
</script>
</body>
</html>
